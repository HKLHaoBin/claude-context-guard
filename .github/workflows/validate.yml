name: Validate

on:
  push:
  pull_request:

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Run PowerShell hook tests
        shell: pwsh
        run: ./hooks/powershell/context-guard.tests.ps1

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check human-in-the-loop template
        run: bash -n skills/diagnosing-bugs/scripts/hitl-loop.template.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check semantic diagnosis package and reproduction helper
        run: python scripts/test-diagnosing-bugs.py
      - name: Check Git whitespace
        run: git show --format= --check HEAD

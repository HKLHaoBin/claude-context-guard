name: Validate

on:
  push:
  pull_request:

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Run PowerShell hook tests
        shell: pwsh
        run: ./hooks/powershell/context-guard.tests.ps1

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check human-in-the-loop template
        run: bash -n skills/diagnosing-bugs/scripts/hitl-loop.template.sh
      - name: Check Git whitespace
        run: git diff --check

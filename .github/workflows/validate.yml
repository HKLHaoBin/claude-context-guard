name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate repository
        shell: pwsh
        run: ./scripts/validate.ps1
      - name: Run PowerShell hook tests
        shell: pwsh
        run: ./hooks/powershell/context-guard.tests.ps1

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check human-in-the-loop template
        run: bash -n skills/diagnosing-bugs/scripts/hitl-loop.template.sh
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check semantic diagnosis package and reproduction helper
        run: python scripts/test-diagnosing-bugs.py
      - name: Check Git whitespace
        run: git show --format= --check HEAD

  goal:
    name: Goal state machine (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Type-check Goal hooks against the documented host boundary
        run: npx --yes --package typescript@5.9.3 tsc --project plugins/goal/tsconfig.json
      - name: Run Goal registry and hook integration tests
        run: node --test plugins/goal/test/registry.test.mjs plugins/goal/test/plugin.test.mjs
      - name: Upload Goal plugin source bundle
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: goal-plugin-source
          path: plugins/goal/
          include-hidden-files: true
